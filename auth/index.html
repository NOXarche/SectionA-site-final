<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martian Auth</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="code-particles"></div>
    <div class="stars"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <button id="back-btn" class="back-btn" onclick="history.go(-1)">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="logo">
                    <h1>JU Civil <span class="gradient-text">Martian</span></h1>
                </div>
                <button id="theme-toggle" class="theme-toggle">
                    <i class="fas fa-sun sun-icon"></i>
                    <i class="fas fa-moon moon-icon"></i>
                </button>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>
            <div class="auth-content">
                <form id="loginForm" class="auth-form active">
                    <h2>Sign in to continue</h2>
                    <p class="auth-subtitle">Enter your roll number and password</p>
                    <div class="form-group">
                        <label for="loginRoll">Roll Number</label>
                        <div class="input-with-icon">
                            <span class="material-icons">badge</span>
                            <input type="text" id="loginRoll" required maxlength="32">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-with-icon">
                            <span class="material-icons">lock</span>
                            <input type="password" id="loginPassword" required>
                            <button type="button" class="toggle-password" style="display: none;">
                                <span class="material-icons">visibility_off</span>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="primary-btn">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </button>
                </form>
                <form id="registerForm" class="auth-form">
                    <h2>Register</h2>
                    <p class="auth-subtitle">Create your account with roll number</p>
                    <div class="form-group">
                        <label for="registerRoll">Roll Number</label>
                        <div class="input-with-icon">
                            <span class="material-icons">badge</span>
                            <input type="text" id="registerRoll" required maxlength="32">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <div class="input-with-icon">
                            <span class="material-icons">lock</span>
                            <input type="password" id="registerPassword" required>
                            <button type="button" class="toggle-password" style="display: none;">
                                <span class="material-icons">visibility_off</span>
                            </button>
                        </div>
                        <div id="password-error" class="error-message" style="display: none; color: red; font-size: 0.8em;">Password must be between 6 and 16 characters long.</div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-with-icon">
                            <span class="material-icons">lock</span>
                            <input type="password" id="confirmPassword" required>
                            <button type="button" class="toggle-password" style="display: none;">
                                <span class="material-icons">visibility_off</span>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="primary-btn">
                        <i class="fas fa-user-plus"></i>
                        Register
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="modal" id="successModal">
        <div class="modal-content success-modal">
            <div class="success-icon">
                <span class="material-icons">check</span>
            </div>
            <h2>Success!</h2>
            <p id="successMessage"></p>
            <button id="successDoneBtn" class="primary-btn">
                <i class="fas fa-arrow-right"></i>
                Continue
            </button>
        </div>
    </div>
    <div id="backdrop" class="backdrop"></div>
    <div id="error-alert" class="alert error-alert" aria-live="assertive">
        <div class="alert-icon-container">
            <div class="alert-icon"></div>
        </div>
        <div class="alert-content">
            <p class="alert-title">Authentication Failed</p>
            <p class="alert-message"></p>
        </div>
    </div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
