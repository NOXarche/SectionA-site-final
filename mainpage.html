<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Martian Civils - JU Section A</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="mainpage.css"/>
  <link href="https://fonts.googleapis.com/css?family=Orbitron:700|Roboto:400,700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- Astronomical Dynamic Background -->
  <canvas id="meteor-bg"></canvas>
  <div class="orbit-container">
    <div class="orbit orbit1"></div>
    <div class="orbit orbit2"></div>
    <div class="orbit orbit3"></div>
    <div class="orbit-planet"></div>
    <div class="orbit-rocket"><span>🚀</span></div>
  </div>
  <div class="martian-bg">
    <div class="bg-stars"></div>
    <div class="bg-mountains"></div>
    <div class="bg-dust"></div>
  </div>
  <header class="navbar glassy">
    <div class="logo-title">
      <span class="logo">🪐</span>
      <span class="site-title">Martian Civils</span>
      <span class="year">(2024–28)</span>
    </div>
    <nav class="nav-actions">
      <button class="nav-btn" id="profileBtn"><span>👤</span> Profile</button>
      <button class="nav-btn" id="themeToggle"><span>🌓</span> Theme</button>
      <button class="nav-btn logout-btn" id="logoutBtn"><span>⎋</span> Logout</button>
    </nav>
  </header>
  <main class="section">
    <h2 id="userGreeting" class="greeting-type"></h2>
    <div class="mainpage-grid">

      <div class="mp-card announcements-section float-card">
        <div class="mp-card-header"><span class="mp-icon">📢</span>Live Announcements</div>
        <div class="announcements-controls">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="today">Today</button>
          <button class="filter-btn" data-filter="high">High Priority</button>
        </div>
        <ul class="announcements-feed" id="announcementsFeed"></ul>
      </div>

      <div class="mp-card schedule-section float-card">
        <div class="mp-card-header"><span class="mp-icon">📅</span>Upcoming Schedule</div>
        <div class="subsection-btn-group" id="subsectionBtns">
          <button class="sub-btn active" data-sub="A1">A1</button>
          <button class="sub-btn" data-sub="A2">A2</button>
          <button class="sub-btn" data-sub="A3">A3</button>
        </div>
        <div class="schedule-timeline" id="scheduleTimeline"></div>
      </div>

      <div class="mp-card resources-section float-card">
        <div class="mp-card-header"><span class="mp-icon">📚</span>Resources</div>
        <ul class="resources-list" id="resourcesList"></ul>
      </div>

      <div class="mp-card gallery-preview-section float-card">
        <div class="mp-card-header"><span class="mp-icon">🖼️</span>Gallery</div>
        <div class="gallery-carousel" id="galleryCarousel"></div>
        <a href="#" class="gallery-link">View Full Gallery →</a>
      </div>

      <div class="mp-card events-section float-card">
        <div class="mp-card-header"><span class="mp-icon">🎉</span>Events</div>
        <ul class="events-list" id="eventsList"></ul>
        <div class="countdown-section">
          <span class="countdown-label">Next Event In:</span>
          <span id="eventCountdown" class="countdown-timer"></span>
        </div>
      </div>

      <div class="mp-card knowledge-bubble float-card">
        <div class="mp-card-header"><span class="mp-icon">🧠</span>Martian Daily Knowledge</div>
        <div class="bubble-content" id="knowledgeBubble"></div>
      </div>

      <div class="mp-card projects-section float-card">
        <div class="mp-card-header"><span class="mp-icon">🛠️</span>Projects & Clubs</div>
        <div class="projects-grid" id="projectsGrid"></div>
      </div>

      <div class="mp-card weather-section float-card">
        <div class="mp-card-header"><span class="mp-icon">☀️</span>Martian Weather</div>
        <div class="weather-widget" id="weatherWidget"></div>
      </div>
    </div>
  </main>
  <footer class="footer glassy">
    <div class="footer-links">
      <button class="footer-btn">Contact</button>
      <button class="footer-btn">About</button>
    </div>
    <div class="footer-credit">Made for <span class="neon">JU Martian Civils</span></div>
  </footer>
  <script src="mainpage.js"></script>
</body>
</html>
